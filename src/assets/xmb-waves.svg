<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06102e"/><stop offset=".52" stop-color="#073d83"/><stop offset="1" stop-color="#02091e"/></linearGradient>
 <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#19aaff" stop-opacity="0"/><stop offset=".48" stop-color="#4bcaff" stop-opacity=".32"/><stop offset="1" stop-color="#7d68ff" stop-opacity="0"/></linearGradient>
 <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6bdfff" stop-opacity="0"/><stop offset=".5" stop-color="#168cff" stop-opacity=".25"/><stop offset="1" stop-color="#a36bff" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<ellipse cx="420" cy="220" rx="600" ry="260" fill="#0875d1" opacity=".2" filter="url(#glow)"/>
<ellipse cx="1550" cy="780" rx="700" ry="300" fill="#173bd0" opacity=".18" filter="url(#glow)"/>
<!-- Broad, softly glowing XMB ribbons -->
<g opacity=".9">
 <path d="M-180 760 C220 330 560 300 900 610 S1510 1010 2100 420 L2100 1080 L-180 1080Z" fill="url(#wave1)" opacity=".6">
  <animateTransform attributeName="transform" type="translate" values="-70 0;70 -22;-70 0" dur="24s" repeatCount="indefinite"/>
 </path>
 <path d="M-180 480 C250 830 590 850 930 570 S1510 180 2100 720 L2100 0 L-180 0Z" fill="url(#wave2)" opacity=".7">
  <animateTransform attributeName="transform" type="translate" values="65 10;-65 -18;65 10" dur="31s" repeatCount="indefinite"/>
 </path>
</g>
<!-- Fine flowing wave lines -->
<g fill="none">
 <g stroke="#53c8ff" stroke-opacity=".28" stroke-width="5">
  <path d="M-140 690 C250 250 590 270 920 560 S1510 990 2070 390">
   <animate attributeName="d" dur="18s" repeatCount="indefinite" values="M-140 690 C250 250 590 270 920 560 S1510 990 2070 390;M-140 730 C250 310 590 230 920 520 S1510 950 2070 430;M-140 690 C250 250 590 270 920 560 S1510 990 2070 390"/>
  </path>
  <path d="M-140 790 C250 360 590 380 920 670 S1510 1080 2070 500">
   <animate attributeName="d" dur="23s" repeatCount="indefinite" values="M-140 790 C250 360 590 380 920 670 S1510 1080 2070 500;M-140 750 C250 400 590 420 920 710 S1510 1030 2070 540;M-140 790 C250 360 590 380 920 670 S1510 1080 2070 500"/>
  </path>
 </g>
 <g stroke="#a4e5ff" stroke-opacity=".14" stroke-width="2">
  <path d="M-120 420 C280 770 600 760 940 480 S1520 100 2060 610">
   <animate attributeName="d" dur="27s" repeatCount="indefinite" values="M-120 420 C280 770 600 760 940 480 S1520 100 2060 610;M-120 460 C280 810 600 720 940 440 S1520 140 2060 650;M-120 420 C280 770 600 760 940 480 S1520 100 2060 610"/>
  </path>
  <path d="M-120 350 C280 700 600 690 940 410 S1520 30 2060 540">
   <animate attributeName="d" dur="21s" repeatCount="indefinite" values="M-120 350 C280 700 600 690 940 410 S1520 30 2060 540;M-120 390 C280 740 600 650 940 370 S1520 70 2060 580;M-120 350 C280 700 600 690 940 410 S1520 30 2060 540"/>
  </path>
 </g>
</g>
</svg>